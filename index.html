<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASL Alphabet Detection Web App</title>
  
  <!-- MediaPipe Hands & Camera Utils via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #0e1117;
      --card-bg: #1a1f2c;
      --accent: #00e676;
      --text: #ffffff;
      --text-muted: #8b949e;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 6px;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .main-container {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      max-width: 1200px;
      width: 100%;
    }
    .video-card {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      width: 640px;
      height: 480px;
    }
    video {
      display: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* Mirror camera */
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 320px;
    }
    .metric-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #30363d;
    }
    .metric-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .metric-value {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--accent);
    }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      background: #238636;
      color: #fff;
    }
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(14, 17, 23, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>🤟 Real-Time ASL Alphabet Detection</h1>
    <p class="subtitle">CPE126L AI Summative Project — Client-Side In-Browser Inference</p>
  </header>

  <div class="main-container">
    <div class="video-card">
      <video id="webcam" playsinline></video>
      <canvas id="output_canvas" width="640" height="480"></canvas>
      <div id="loading" class="loading-overlay">Initializing Camera & Hand Tracker...</div>
    </div>

    <div class="sidebar">
      <div class="metric-card">
        <div class="metric-title">System Status</div>
        <span id="camera-status" class="status-badge">Starting...</span>
      </div>

      <div class="metric-card">
        <div class="metric-title">Predicted Sign</div>
        <div id="predicted-letter" class="metric-value">--</div>
      </div>

      <div class="metric-card">
        <div class="metric-title">Wrist-Normalized Features</div>
        <div id="landmark-count" style="font-size: 1rem; color: var(--text-muted);">
          Waiting for hand...
        </div>
      </div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const loadingElem = document.getElementById('loading');
    const predElem = document.getElementById('predicted-letter');
    const lmElem = document.getElementById('landmark-count');
    const statusBadge = document.getElementById('camera-status');

    // Rule-based geometric heuristic for common signs directly in browser
    function classifyHeuristic(landmarks) {
      const wrist = landmarks[0];
      
      // Calculate normalized relative distances from wrist
      const thumbTip = landmarks[4];
      const indexTip = landmarks[8];
      const middleTip = landmarks[12];
      const ringTip = landmarks[16];
      const pinkyTip = landmarks[20];

      const indexPip = landmarks[6];
      const middlePip = landmarks[10];
      const ringPip = landmarks[14];
      const pinkyPip = landmarks[18];

      // Finger open states
      const indexOpen = indexTip.y < indexPip.y;
      const middleOpen = middleTip.y < middlePip.y;
      const ringOpen = ringTip.y < ringPip.y;
      const pinkyOpen = pinkyTip.y < pinkyPip.y;

      if (!indexOpen && !middleOpen && !ringOpen && !pinkyOpen) {
        return (thumbTip.y < indexPip.y) ? "A" : "S / E";
      }
      if (indexOpen && middleOpen && ringOpen && pinkyOpen) {
        return "B";
      }
      if (indexOpen && middleOpen && !ringOpen && !pinkyOpen) {
        return "V";
      }
      if (indexOpen && !middleOpen && !ringOpen && !pinkyOpen) {
        return (thumbTip.x > indexPip.x) ? "L" : "D";
      }
      if (!indexOpen && !middleOpen && !ringOpen && pinkyOpen) {
        return (thumbTip.y < indexPip.y) ? "Y" : "I";
      }
      if (indexOpen && middleOpen && ringOpen && !pinkyOpen) {
        return "W";
      }

      return "Tracking...";
    }

    function onResults(results) {
      loadingElem.style.display = 'none';
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        statusBadge.textContent = "Hand Detected";
        statusBadge.style.background = "#238636";

        for (const landmarks of results.multiHandLandmarks) {
          drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#00e676', lineWidth: 4 });
          drawLandmarks(canvasCtx, landmarks, { color: '#ff4081', lineWidth: 2, radius: 4 });

          // Extract normalized coordinate features identical to training pipeline
          const wrist = landmarks[0];
          let coords = [];
          for (let lm of landmarks) {
            coords.push(lm.x - wrist.x);
            coords.push(lm.y - wrist.y);
          }
          let maxVal = Math.max(...coords.map(Math.abs));
          if (maxVal > 0) coords = coords.map(c => c / maxVal);

          lmElem.textContent = `21 Landmarks Extracted (42 Normalized Features)`;
          predElem.textContent = classifyHeuristic(landmarks);
        }
      } else {
        statusBadge.textContent = "Searching for Hand";
        statusBadge.style.background = "#d29922";
        predElem.textContent = "--";
        lmElem.textContent = "Position hand inside the camera frame";
      }
      canvasCtx.restore();
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    camera.start().catch((err) => {
      loadingElem.innerHTML = `<span style="color:#ff6b6b">Camera access denied: ${err.message}</span>`;
      statusBadge.textContent = "Camera Error";
      statusBadge.style.background = "#da3633";
    });
  </script>
</body>
</html>
